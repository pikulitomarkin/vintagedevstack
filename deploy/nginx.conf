server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API agenda (container_name vintage-api-1 — evita colisão com api do Clube na rede compartilhada)
  location /api/ {
    proxy_pass http://vintage-api-1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
  }

  # SPA fallback (React Router) — HTML sem cache para não servir JS antigo
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|webm|mp4)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
